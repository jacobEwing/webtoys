<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		html, body {
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: space-around;
			align-items: center;
			overflow: hidden;

		}
		body > div {
			border: 1px solid #aaa;
		}

	</style>

	<script type="text/javascript">
		var maxDepth = 7;
		var canvas, context;
		window.onload = function(){
			canvas = document.getElementsByTagName('canvas')[0];
			context = canvas.getContext('2d');
			box(canvas.width * .375, canvas.width * .375, canvas.width >> 2, maxDepth);
		}

		function box(x1, y1, width, depth){
			context.beginPath();
			context.rect(x1, y1, width, width);

			context.fillStyle = getColour(depth);
			context.fill();

			var newWidth = width * .3;
			depth--;
			if(depth > 0){
				
				box(x1, y1 - newWidth, newWidth, depth);
				box(x1 + width - newWidth, y1 - newWidth, newWidth, depth);

				box(x1 + width, y1, newWidth, depth);
				box(x1 + width, y1 + width - newWidth, newWidth, depth);

				box(x1, y1 + width, newWidth, depth);
				box(x1 + width - newWidth, y1 + width, newWidth, depth);

				box(x1 - newWidth, y1, newWidth, depth);
				box(x1 - newWidth, y1 + width - newWidth, newWidth, depth);
			}
			
		}
	
		function getColour(idx){
			let ang = idx ;
			let rval = 'rgb('
				+ Math.round(127.5 + 127.5 * Math.sin(ang + 1)) + ","
				+ Math.round(127.5 + 127.5 * Math.sin(ang)) + ","
				+ Math.round(127.5 + 127.5 * Math.sin(ang - 1)) + ","
				+ ")";
			return rval;
		}
	</script>
</head>
<body>
	<div><canvas width=600 height=600></canvas></div>
</body>
</html>
